<!doctype html>
<html lang="es">

<head>
  <title>ChessiL - Iniciar sesión</title>
  <meta charset="utf-8">
  <meta name="viewport" content="initial-scale=1, width=device-width, height=device-height">
  <meta name="description" content="Inicia sesión en ChessiL para jugar partidas clasificadas">
  <meta name="keywords" content="ajedrez, login, iniciar, sesión, entrar, en línea, online, clasificadas">
  <link rel="stylesheet" href="/css/site.css">
  <link rel="stylesheet" href="/css/auth.css">
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <link rel="stylesheet" href="/css/grandmaster.css">
  <link rel="stylesheet" href="/css/components.css">
  <script src="/js/connections.js"></script>
  <script src="/js/header.js"></script>
  <script src="/js/load.js"></script>
</head>

<body class="fixed-scroll">
  <!-- component:header -->
  <div class="main-wrap isauthwrap">
    <main class="auth auth-login box box-pad">
      <h1 class="box__top">Iniciar sesión</h1>
      <form method="post" class="form3" action="/login">
        <div class="one-factor">
          <div class="form-group"><label class="form-label" for="form3-username">Nombre de usuario</label><input
              id="form3-username" name="username" value="" class="form-control" minlength="2" maxlength="20"
              autofocus="autofocus" required="required" autocomplete="username"></input></div>
          <div class="form-group"><label class="form-label" for="form3-password">Contraseña</label><input
              id="form3-password" name="password" value="" type="password" class="form-control" required="required"
              autocomplete="current-password"></input></div><button type="submit" class="submit button">Iniciar
            sesión</button>
        </div>
      </form>
      <div class="alternative"><a href="/es/register">Registrarse</a></div>
    </main>
  </div>
  <!-- component:footer -->
</body>

</html>
