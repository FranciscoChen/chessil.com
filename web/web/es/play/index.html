<!doctype html>
<html lang="es">

<head>
  <title>ChessiL - Partida de ajedrez</title>
  <meta charset="utf-8">
  <meta name="viewport" content="initial-scale=1, width=device-width, height=device-height">
  <meta name="description" content="Partida de ajedrez en línea entre usuarios o personas anónimas">
  <meta name="keywords" content="ajedrez, online, en vivo, partida, realtime, encuentro">
  <link rel="stylesheet" href="/css/site.css">
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <link rel="stylesheet" href="/css/board.min.css">
  <link rel="stylesheet" href="/css/components.css">
  <link rel="stylesheet" href="/css/dialog.css">
  <link rel="stylesheet" href="/css/play.css">
  <script src="/js/connections.js"></script>
  <script src="/js/header.js"></script>
  <script src="/js/game.min.js"></script>
  <script src="/js/gamepage.js"></script>
  <script src="/js/load.js"></script>
</head>

<body class="game-page">
  <!-- component:header -->
  <main class="game-shell">
    <div class="game-heading">
      <div><p class="eyebrow">EN EL TABLERO</p><h1>Partida de ajedrez</h1><p class="setup" data-game-field="setup">Cargando partida…</p></div>
      <div class="game-heading-actions"><button id="open-board-settings" class="ui-button ui-secondary" type="button" aria-haspopup="dialog">Tablero y sonido</button><a class="ui-button ui-quiet" href="/lobby">← Sala</a><button class="ui-button ui-secondary" id="share-game" type="button">Compartir</button><span id="share-status" class="game-sr-only" role="status"></span></div>
    </div>
    <div class="round">
      <div class="round__app">
        <section class="game-player game-player--top" aria-label="Negras">
          <div class="user-link ruser ruser-top online">
            <span class="player-mark player-mark--black" aria-hidden="true"></span>
            <div class="player-details"><name data-game-field="username2">…</name><div class="player-meta"><span>Negras</span><rating data-game-field="rating2">—</rating></div></div>
          </div>
          <div class="rclock rclock-top"><div class="bar"></div><div class="time hour">—:—</div></div>
        </section>
        <div class="round__app__board board" aria-label="Tablero de ajedrez">
          <div class="cg-wrap manipulable"><cg-container><cg-board></cg-board><coords class="ranks"><coord>1</coord><coord>2</coord><coord>3</coord><coord>4</coord><coord>5</coord><coord>6</coord><coord>7</coord><coord>8</coord></coords><coords class="files"><coord>a</coord><coord>b</coord><coord>c</coord><coord>d</coord><coord>e</coord><coord>f</coord><coord>g</coord><coord>h</coord></coords></cg-container></div>

        </div>
        <section class="game-player game-player--bottom" aria-label="Blancas">
          <div class="user-link ruser ruser-bottom online">
            <span class="player-mark player-mark--white" aria-hidden="true"></span>
            <div class="player-details"><name data-game-field="username1">…</name><div class="player-meta"><span>Blancas</span><rating data-game-field="rating1">—</rating></div></div>
          </div>
          <div class="rclock rclock-bottom"><div class="bar"></div><div class="time hour">—:—</div></div>
        </section>
        <moves-panel aria-label="Jugadas">
          <div class="game-panel-heading"><h2>Jugadas</h2><span class="status" data-game-field="state" role="status">Conectando…</span></div>
          <p class="game-perspective" id="game-perspective">Conectando…</p>
          <p class="game-empty" id="moves-empty">La primera jugada está por llegar.</p>
          <moves-list></moves-list>
          <div class="buttons"><button id="rw" type="button" class="fbt" title="Primera jugada" aria-label="Primera jugada" disabled>|‹</button><button id="sb" type="button" class="fbt" title="Jugada anterior" aria-label="Jugada anterior" disabled>‹</button><button id="fw" type="button" class="fbt" title="Siguiente jugada" aria-label="Siguiente jugada" disabled>›</button><button id="ff" type="button" class="fbt" title="Última jugada" aria-label="Última jugada" disabled>›|</button></div>
          <p class="game-history-hint" id="history-hint">Revisa las jugadas al terminar la partida.</p>
        </moves-panel>
        <div class="rcontrols game-actions"><div class="ricons"><button type="button" class="fbt draw-yes" disabled><span>Ofrecer tablas</span></button><button type="button" class="fbt resign" disabled><span>Rendirse</span></button></div><div class="game-followup" hidden><a class="ui-button ui-primary" href="/lobby">Nueva partida</a><a class="ui-button ui-secondary" href="/easy">Jugar con IA</a></div></div>
      </div>
      <p class="round__underboard game-guidance" id="game-guidance">Arrastra una pieza o toca la pieza y su destino.</p>
    </div>
  </main>
  <dialog id="board-settings-dialog" class="board-settings-dialog"><button type="button" class="dialog-close" data-close-board-settings aria-label="Close">×</button><div data-board-settings></div></dialog>
  <!-- component:footer -->
</body>
</html>
