<!doctype html>
<html lang="en">

<head>
  <title>ChessiL - Easy Game</title>
  <meta charset="utf-8">
  <meta name="viewport" content="initial-scale=1, width=device-width, height=device-height">
  <meta name="description" content="Start a rated or unrated game against a chess bot">
  <meta name="keywords" content="chess, bot, easy, play, rated, unrated">
  <link rel="stylesheet" href="/css/site.css">
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <link rel="stylesheet" href="/css/showcase.css">
  <link rel="stylesheet" href="/css/lobby.css">
  <link rel="stylesheet" href="/css/easy.css">
  <link rel="stylesheet" href="/css/grandmaster.css">
  <link rel="stylesheet" href="/css/components.css">
  <script src="/js/connections.js"></script>
  <script src="/js/header.js"></script>
  <script src="/js/easy.js"></script>
  <script src="/js/load.js"></script>
</head>

<body class="easy-page">
  <!-- component:header -->
  <div class="main-wrap">
    <main class="main" id="main">
      <section class="showcase easy-showcase" aria-labelledby="easy-title">
        <div class="showcase-grid">
                      
          
          <span class="bg-star b1"></span>
          <span class="bg-star b2"></span>
          <span class="bg-star b3"></span>
          <span class="bg-star b4"></span>
          <span class="bg-star b5"></span>
          <span class="bg-star b6"></span>

          
          <h1 id="easy-title" class="showcase-headings">Easy Game</h1>
          <p id="easy-subtitle" class="showcase-paragraph">Start quickly or fine-tune your match against a bot.</p>

          <section class="easy-quick easy-card" aria-labelledby="easy-quick-title">
            <h2 id="easy-quick-title" class="easy-section-title">Quick start</h2>
            <p class="text easy-muted">Unrated by default. We pick a bot close to your Elo.</p>
            <div class="easy-quick-actions">
              <button id="easy-quick-start" class="action easy-primary">Quick start</button>
              <a href="#easy-more" class="action alternative easy-more-link">More options</a>
            </div>
            <div class="easy-quick-controls" aria-label="Quick settings">
              <div class="easy-field">
                <label for="easy-time">Time control</label>
                <select id="easy-time">
                  <option value="1+0">1+0</option>
                  <option value="3+0">3+0</option>
                  <option value="3+2">3+2</option>
                  <option value="5+0" selected>5+0</option>
                  <option value="10+0">10+0</option>
                  <option value="15+10">15+10</option>
                </select>
              </div>
              <div class="easy-field">
                <label for="easy-color">Color</label>
                <select id="easy-color">
                  <option value="random" selected>Random</option>
                  <option value="white">White</option>
                  <option value="black">Black</option>
                </select>
              </div>
            </div>
          </section>

          <div id="easy-status" class="text" role="status" aria-live="polite"></div>
        </div>
      </section>

      
      

      <section id="easy-more" class="showcase easy-showcase" aria-labelledby="easy-more-title">
        <div class="showcase-grid">
                      
          
          <span class="bg-star b1"></span>
          <span class="bg-star b2"></span>
          <span class="bg-star b3"></span>
          <span class="bg-star b4"></span>
          <span class="bg-star b5"></span>
          <span class="bg-star b6"></span>

          </div>

          <h2 id="easy-more-title" class="showcase-headings">More options</h2>
          <p class="showcase-paragraph">Adjust filters and choose a specific bot.</p>

          <section class="easy-filters easy-card" aria-labelledby="easy-filters-title">
            <h3 id="easy-filters-title" class="easy-section-title">Filters</h3>
            <div class="filters-primary">
              <div class="easy-field">
                <label for="easy-rated">Rated</label>
                <select id="easy-rated" aria-describedby="easy-rating-hint">
                  <option value="0" selected>Unrated</option>
                  <option value="1">Rated</option>
                </select>
              </div>
              <div class="easy-field">
                <label for="easy-filter-by">Filter by</label>
                <select id="easy-filter-by">
                  <option value="rating" selected>Filter by Elo</option>
                  <option value="uci_elo">Filter by UCI Elo</option>
                </select>
              </div>
              <div class="easy-field">
                <label for="easy-elo-min">Min Elo</label>
                <input id="easy-elo-min" type="number" placeholder="Min Elo">
              </div>
              <div class="easy-field">
                <label for="easy-elo-max">Max Elo</label>
                <input id="easy-elo-max" type="number" placeholder="Max Elo">
              </div>
            </div>
            <p id="easy-rating-hint" class="text easy-hint">Rated games require Elo within 500.</p>
            <p id="easy-rated-note" class="text easy-note" aria-live="polite"></p>
          </section>

          <section class="easy-results easy-card" aria-labelledby="easy-results-title">
            <div class="easy-results-head">
              <h3 id="easy-results-title" class="easy-section-title">Available bots</h3>
              <p class="easy-results-meta text">Choose a bot to start immediately.</p>
            </div>
            <div class="results">
              <div id="easy-bot-list" class="results-flex" role="region" aria-label="Available bots"></div>
            </div>
          </section>
        </div>
      </section>
    </main>
  </div>
  <!-- component:footer -->
</body>

</html>
