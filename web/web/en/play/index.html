<!doctype html>
<html lang="en">

<head>
  <title>ChessiL - Chess game</title>
  <meta charset="utf-8">
  <meta name="viewport" content="initial-scale=1, width=device-width, height=device-height">
  <meta name="description" content="Live online chess game played between users or anonymous people">
  <meta name="keywords" content="chess, online, live, game, realtime, match">
  <link rel="stylesheet" href="/css/site.css">
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <link rel="stylesheet" href="/css/game.css">
  <link rel="stylesheet" href="/css/components.css">
  <link rel="stylesheet" href="/css/dialog.css">
  <link rel="stylesheet" href="/css/play.css">
  <script src="/js/connections.js"></script>
  <script src="/js/header.js"></script>
  <script src="/js/game.js"></script>
  <script src="/js/gamepage.js"></script>
  <script src="/js/load.js"></script>
</head>

<body class="game-page">
  <!-- component:header -->
  <main class="game-shell">
    <div class="game-heading">
      <div><p class="eyebrow">AT THE BOARD</p><h1>Chess game</h1><p class="setup" data-game-field="setup">Loading game…</p></div>
      <div class="game-heading-actions"><a class="ui-button ui-quiet" href="/lobby">← Lobby</a><button class="ui-button ui-secondary" id="share-game" type="button">Share</button><span id="share-status" class="game-sr-only" role="status"></span></div>
    </div>
    <div class="round">
      <div class="round__app">
        <section class="game-player game-player--top" aria-label="Black">
          <div class="user-link ruser ruser-top online">
            <span class="player-mark player-mark--black" aria-hidden="true"></span>
            <div class="player-details"><name data-game-field="username2">…</name><div class="player-meta"><span>Black</span><rating data-game-field="rating2">—</rating></div></div>
          </div>
          <div class="rclock rclock-top"><div class="bar"></div><div class="time hour">—:—</div></div>
        </section>
        <div class="round__app__board board" aria-label="Chessboard">
          <div class="cg-wrap manipulable"><cg-container><cg-board></cg-board><coords class="ranks"><coord>1</coord><coord>2</coord><coord>3</coord><coord>4</coord><coord>5</coord><coord>6</coord><coord>7</coord><coord>8</coord></coords><coords class="files"><coord>a</coord><coord>b</coord><coord>c</coord><coord>d</coord><coord>e</coord><coord>f</coord><coord>g</coord><coord>h</coord></coords></cg-container></div>
          <div class="material material-bottom material-no"><button id="prq" type="button" aria-label="Queen"><mpiece class="queen"></mpiece></button><button id="prr" type="button" aria-label="Rook"><mpiece class="rook"></mpiece></button><button id="prb" type="button" aria-label="Bishop"><mpiece class="bishop"></mpiece></button><button id="prn" type="button" aria-label="Knight"><mpiece class="knight"></mpiece></button></div>
        </div>
        <section class="game-player game-player--bottom" aria-label="White">
          <div class="user-link ruser ruser-bottom online">
            <span class="player-mark player-mark--white" aria-hidden="true"></span>
            <div class="player-details"><name data-game-field="username1">…</name><div class="player-meta"><span>White</span><rating data-game-field="rating1">—</rating></div></div>
          </div>
          <div class="rclock rclock-bottom"><div class="bar"></div><div class="time hour">—:—</div></div>
        </section>
        <moves-panel aria-label="Move history">
          <div class="game-panel-heading"><h2>Move history</h2><span class="status" data-game-field="state" role="status">Connecting…</span></div>
          <p class="game-perspective" id="game-perspective">Connecting…</p>
          <p class="game-empty" id="moves-empty">Waiting for the first move.</p>
          <moves-list></moves-list>
          <div class="buttons"><button id="rw" type="button" class="fbt" title="First move" aria-label="First move" disabled>|‹</button><button id="sb" type="button" class="fbt" title="Previous move" aria-label="Previous move" disabled>‹</button><button id="fw" type="button" class="fbt" title="Next move" aria-label="Next move" disabled>›</button><button id="ff" type="button" class="fbt" title="Last move" aria-label="Last move" disabled>›|</button></div>
          <p class="game-history-hint" id="history-hint">Review moves after the game.</p>
        </moves-panel>
        <div class="rcontrols game-actions"><div class="ricons"><button type="button" class="fbt draw-yes" disabled><span>Offer draw</span></button><button type="button" class="fbt resign" disabled><span>Resign</span></button></div><div class="game-followup" hidden><a class="ui-button ui-primary" href="/lobby">New game</a><a class="ui-button ui-secondary" href="/easy">Play computer</a></div></div>
      </div>
      <p class="round__underboard game-guidance" id="game-guidance">Drag a piece, or tap a piece and its destination.</p>
    </div>
  </main>
  <!-- component:footer -->
</body>
</html>
