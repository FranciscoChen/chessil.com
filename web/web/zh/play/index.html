<!doctype html>
<html lang="zh">

<head>
  <title>ChessiL - 对局</title>
  <meta charset="utf-8">
  <meta name="viewport" content="initial-scale=1, width=device-width, height=device-height">
  <meta name="description" content="用户或匿名之间的在线国际象棋对局">
  <meta name="keywords" content="国际象棋, 在线, 实时, 对局, 比赛">
  <link rel="stylesheet" href="/css/site.css">
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <link rel="stylesheet" href="/css/game.css">
  <link rel="stylesheet" href="/css/grandmaster.css">
  <link rel="stylesheet" href="/css/components.css">
  <script src="/js/connections.js"></script>
  <script src="/js/header.js"></script>
  <script src="/js/game.js"></script>
  <script src="/js/gamepage.js"></script>
  <script src="/js/load.js"></script>
</head>

<body class="fixed-scroll">
  <!-- component:header -->
  <div class="main-wrap">
    <div class="round">
      <div class="round__app">
        <div class="round__app__board board">
          <div class="cg-wrap manipulable"><cg-container><cg-board></cg-board>
              <coords class="ranks">
                <coord>1</coord>
                <coord>2</coord>
                <coord>3</coord>
                <coord>4</coord>
                <coord>5</coord>
                <coord>6</coord>
                <coord>7</coord>
                <coord>8</coord>
              </coords>
              <coords class="files">
                <coord>a</coord>
                <coord>b</coord>
                <coord>c</coord>
                <coord>d</coord>
                <coord>e</coord>
                <coord>f</coord>
                <coord>g</coord>
                <coord>h</coord>
              </coords>
            </cg-container></div>
        </div>
        <div class="material material-top"></div>
        <div class="round__app__table"></div>
        <div class="user-link ruser ruser-top online"><i class="line"></i>
          <name data-game-field="username2">...</name>
          <rating data-game-field="rating2">-</rating>
        </div>
        <moves-panel>
          <div class="buttons">
            <div class="noop"></div><button id="rw" title="第一步" aria-label="第一步" class="fbt"></button><button id="sb" title="上一步" aria-label="上一步" class="fbt"></button><button
              id="fw" title="下一步" aria-label="下一步" class="fbt"></button><button id="ff" title="最后一步" aria-label="最后一步" class="fbt"></button>
            <div class="noop"></div>
          </div>
          <moves-list></moves-list>
        </moves-panel>
        <div class="rcontrols">
          <div class="ricons"><button class="fbt draw-yes"><span></span></button><button
              class="fbt resign"><span></span></button></div>
        </div>
        <div class="user-link ruser ruser-bottom online"><i class="line"></i>
          <name data-game-field="username1">...</name>
          <rating data-game-field="rating1">-</rating>
        </div>
        <div class="rclock rclock-top">
          <div class="bar"></div>
          <div class="time hour"></div>
        </div>
        <div class="rclock rclock-bottom">
          <div class="bar"></div>
          <div class="time hour"></div>
        </div>
        <div class="material material-bottom">
          <div id="prq">
            <mpiece class="queen"></mpiece>
          </div>
          <div id="prr">
            <mpiece class="rook"></mpiece>
          </div>
          <div id="prb">
            <mpiece class="bishop"></mpiece>
          </div>
          <div id="prn">
            <mpiece class="knight"></mpiece>
          </div>
        </div>
      </div>
      <div class="round__underboard"></div>
      <div class="status" data-game-field="state">...</div>
      <div class="setup" data-game-field="setup">...</div>
    </div>
  </div>
  <!-- component:footer -->
</body>

</html>
