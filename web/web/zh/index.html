<!doctype html>
<html lang="zh">

<head>
  <title>ChessiL - 在线国际象棋</title>
  <meta charset="utf-8">
  <meta name="viewport" content="initial-scale=1, width=device-width, height=device-height">
  <meta name="description" content="在 ChessiL.com 下快速国际象棋">
  <meta name="keywords" content="国际象棋, 在线, 对弈, 快速, 实时, 超快棋, 子弹, 闪电, 快棋">
  <link rel="stylesheet" href="/css/site.css">
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <link rel="stylesheet" href="/css/showcase.css">
  <link rel="stylesheet" href="/css/grandmaster.css">
  <link rel="stylesheet" href="/css/components.css">
  <script src="/js/connections.js"></script>
  <script src="/js/header.js"></script>
  <script src="/js/load.js"></script>
</head>

<body>
  <!-- component:header -->
  <div class="main-wrap">
    <div class="main">
      <div class="showcase">
        <div class="showcase-grid">
                      
          
          <span class="bg-star b1"></span>
          <span class="bg-star b2"></span>
          <span class="bg-star b3"></span>
          <span class="bg-star b4"></span>
          <span class="bg-star b5"></span>
          <span class="bg-star b6"></span>

          
          <h1 class="showcase-headings">对弈</h1>
          <p class="showcase-paragraph">进行一局休闲棋，或寻找更合适的对局</p>
          <div class="showcase-action">
            <a href="/zh/easy"><button class="action">简单对局</button></a>
          </div>
          <div class="showcase-alternative">
            <a href="/zh/lobby"><button class="action alternative" type="submit">进入大厅</button></a>
          </div>
        </div>
      </div>
      <section class="showcase ranked-showcase" aria-labelledby="ranked-title">
        <div class="showcase-grid">
          <span class="bg-star b1"></span>
          <span class="bg-star b2"></span>
          <span class="bg-star b3"></span>
          <span class="bg-star b4"></span>
          <span class="bg-star b5"></span>
          <span class="bg-star b6"></span>

          <h2 id="ranked-title" class="showcase-headings">排位赛</h2>
          <p class="showcase-paragraph">在匹配池中寻找排位赛，或浏览所有开放对局。</p>
          <div class="showcase-action">
            <a class="action ranked-primary" href="/zh/lobby?rated=1&amp;mode=play">寻找排位赛</a>
          </div>
          <div class="showcase-alternative">
            <a class="action alternative" href="/zh/lobby">浏览大厅</a>
          </div>
        </div>
      </section>
            <div class="showcase">
        <div class="showcase-grid">
                      
          
          <span class="bg-star b1"></span>
          <span class="bg-star b2"></span>
          <span class="bg-star b3"></span>
          <span class="bg-star b4"></span>
          <span class="bg-star b5"></span>
          <span class="bg-star b6"></span>

          
          <h1 class="showcase-headings">练习</h1>
          <p class="showcase-paragraph">练习开局并打磨残局</p>
          <div class="showcase-action">
            <button class="action">随机开局</button>
          </div>
          <div class="showcase-alternative">
            <button class="action alternative" type="button">残局练习</button>
          </div>
        </div>
      </div>
            <div class="showcase">
        <div class="showcase-grid">
                      
          
          <span class="bg-star b1"></span>
          <span class="bg-star b2"></span>
          <span class="bg-star b3"></span>
          <span class="bg-star b4"></span>
          <span class="bg-star b5"></span>
          <span class="bg-star b6"></span>

          
          <h1 class="showcase-headings">研究</h1>
          <p class="showcase-paragraph">探索策略，发现新的下法</p>
          <div class="showcase-action">
            <button class="action">顶级策略</button>
          </div>
          <div class="showcase-alternative">
            <button class="action alternative" type="button">浏览数据库</button>
          </div>
        </div>
      </div>
    </div>
  </div>
  <!-- component:footer -->
</body>

</html>
