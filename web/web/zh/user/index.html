<!doctype html>
<html lang="zh">

<head>
  <title>ChessiL - 用户资料</title>
  <meta charset="utf-8">
  <meta name="viewport" content="initial-scale=1, width=device-width, height=device-height">
  <meta name="description" content="用户资料页，包含评分与对局历史">
  <meta name="keywords" content="国际象棋, 用户, 资料, 评分, 对局, 历史">
  <link rel="stylesheet" href="/css/site.css">
  <link rel="stylesheet" href="/css/user.css">
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <link rel="stylesheet" href="/css/grandmaster.css">
  <link rel="stylesheet" href="/css/components.css">
  <script src="/js/connections.js"></script>
  <script src="/js/header.js"></script>
  <script src="/js/u.js"></script>
  <script src="/js/load.js"></script>
</head>

<body>
  <!-- component:header -->
  <div class="main-wrap">
    <main class="page-menu">
      <aside class="page-menu__menu">
        <div class="side sub-ratings"><a><span>
              <h3>等级分</h3>
              <rating><strong>0</strong> <span>
                  <n>0</n> 对局
                </span></rating>
            </span></a></div>
      </aside>
      <div class="page-menu__content box user-show">
        <div class="box__top user-show__header">
          <h1><span class="online user-link" data-user-field="user-link"><i class="line"></i><span
                data-user-field="username">...</span></span></h1>
          <div class="btn-rack__btn"></div>
        </div>
        <section class="fair-play-panel" aria-labelledby="fair-play-heading">
          <div class="fair-play-panel__heading"><h2 id="fair-play-heading">公平竞赛提示</h2><span class="fair-play-status" data-fair-play="status">自动检测</span></div>
          <dl class="fair-play-metrics">
            <div><dt>可疑程度</dt><dd><strong data-fair-play="warning">—</strong><span> / 100</span></dd></div>
            <div><dt>被标记对局比例</dt><dd><strong data-fair-play="rate">—</strong></dd></div>
          </dl>
          <meter data-fair-play="meter" min="0" max="100" low="20" high="60" optimum="0" value="0" hidden aria-label="可疑程度"></meter>
          <p class="fair-play-coverage" data-fair-play="coverage" aria-live="polite">正在加载分析状态…</p>
          <p class="fair-play-note">自动提示并非定论。该比例表示被系统标记的对局，而非已证实作弊的对局。 依据最近30天内最多32盘人类对局。</p>
        </section>
        <div class="angle-content">
          <div class="number-menu number-menu--tabs menu-box-pop" id="games"><button type="button" class="nm-item to-all active"><strong>0</strong><br>对局</button><button type="button" class="nm-item to-rated"><strong>0</strong><br>排位赛</button><button type="button" class="nm-item to-win"><strong>0</strong><br>胜</button><button type="button" class="nm-item to-loss"><strong>0</strong><br>负</button><button type="button" class="nm-item to-draw"><strong>0</strong><br>和</button><button type="button" class="nm-item to-playing"><strong>0</strong><br>进行中</button></div>
          <div class="search__result">
            <div class="games infinite-scroll"></div>
          </div>
        </div>
      </div>
    </main>
  </div>
  <!-- component:footer -->
</body>

</html>
